<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo Login — Team Vault</title>
<style>body{font:16px system-ui;background:#f3f6f4;color:#1e3028;margin:0;display:grid;place-items:center;min-height:100vh}main{background:white;padding:36px;border:1px solid #dce6df;border-radius:16px;width:min(380px,80vw)}h1{margin:8px 0}p{color:#63756a;font-size:14px}label{display:block;margin:20px 0}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #bccfc3;border-radius:8px;font:inherit}button{padding:11px 18px;background:#2e6a52;border:0;border-radius:8px;color:white;cursor:pointer;font:inherit}small{color:#2e6a52}</style></head>
<body><main><small>TEAM VAULT · TEST WEBSITE</small><h1>Sign in to Demo App</h1><p>Use synthetic credentials to test the Chrome extension.</p>
<form id="login-form"><label>Email / username<input id="username" name="username" type="text" autocomplete="username" required></label><label>Password<input id="password" name="password" type="password" autocomplete="current-password" required></label><button type="submit">Sign in</button></form><p id="result" role="status"></p></main>
<script>document.getElementById('login-form').addEventListener('submit',function(event){event.preventDefault();document.getElementById('result').textContent='Demo form submitted. This page does not verify credentials.';});</script></body></html>
